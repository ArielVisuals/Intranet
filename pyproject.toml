[tool.vercel]
entrypoint = "config.wsgi:application"
build-command = "python manage.py collectstatic --noinput"

[project]
name = "intranet"
version = "0.1.0"
dependencies = [
    "django>=5.2,<6.0",
    "python-dotenv>=1.0.0",
    "whitenoise>=6.0.0",
    "psycopg2-binary>=2.9.0",
    "cloudinary>=1.36.0",
    "django-cloudinary-storage>=0.3.0",
]